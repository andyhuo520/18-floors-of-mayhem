<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八十一难 · 木台斗妖</title><link rel="stylesheet" href="/trials.css"></head><body><main><header><a href="/">← 返回坠落乱斗</a><span>真男人就下 18 层 / 新篇章</span><button id="pause" disabled>暂停 · Esc</button><button id="sound">声音：关</button></header><section class="intro"><p>WESTWARD / 81 TRIALS</p><h1>八十一难 · 木台斗妖</h1><p>木台不再下坠。看破妖招，打倒妖王，再赴下一难。</p></section><section class="stage"><div class="status"><span id="chapter"></span><span id="health"></span></div><div class="boss-bar"><div id="boss-life"></div><strong id="boss-name"></strong></div><div class="boss-bar guard-bar"><div id="boss-guard"></div><strong id="guard-label">护体</strong></div><canvas id="trial" width="960" height="600" aria-label="横向木台 Boss 战场"></canvas><div id="overlay"><h2 id="outcome">准备闯关</h2><p id="outcome-note">每关一个妖王，一条生命开局。先看预警，再出手。</p><button id="resume" hidden>继续战斗</button><button id="start">开始挑战</button><button id="retry" hidden>再战此难</button><button id="next" hidden>下一难 →</button></div></section><p id="battle-status" role="status"></p><p id="tip"></p><nav id="weapons" aria-label="武器选择"></nav><div class="controls"><button data-key="left">A / ← 左移</button><button data-key="right">D / → 右移</button><button data-key="jump">空格 · 跳跃</button><button data-key="dash">L · 闪避</button><button data-key="fire">J · 射击</button><button data-key="bomb" id="bomb">K · 投掷</button><button data-key="down">S / ↓ 搓招</button><button id="ultimate" disabled>↓ → J · 角色绝招</button></div><section class="journey"><div><h2>取经路书</h2><p>当前为 9 位妖王轮换 × 9 轮规则，共 81 个组合关卡。每关换一位妖王，第 10 关起进入下一轮强化；尚非 81 个独立剧情劫难。逐关解锁，可重打已通关关卡。</p></div><label><input type="checkbox" id="companion"> 带上电脑搭子助战</label><div id="route"></div></section><footer>1–4 切换兵器 · 拾取红心、护盾、灵气 · 投掷次数会缓慢恢复 · 进度保存在本机</footer></main><script type="module" src="/trials.js"></script></body></html>
